{% extends "base.html" %}

{% block title %}修改密码{% endblock %}

{% block content %}
<div class="password-page">
    <section class="panel password-panel">
        <div class="section-heading">
            <span class="section-icon blue"><i data-lucide="key-round"></i></span>
            <div><h2>修改密码</h2><p>{% if user.must_change_password %}首次登录，请先设置自己的密码{% else %}定期更新密码有助于保护成果材料{% endif %}</p></div>
        </div>
        {% if error %}<div class="page-message error"><i data-lucide="circle-alert"></i>{{ error }}</div>{% endif %}
        <form method="post" action="/change-password" class="password-form">
            <label><span>当前密码</span><input type="password" name="current_password" autocomplete="current-password" required></label>
            <label><span>新密码</span><input type="password" name="new_password" minlength="8" autocomplete="new-password" required></label>
            <label><span>确认新密码</span><input type="password" name="confirm_password" minlength="8" autocomplete="new-password" required></label>
            <div class="form-actions">
                {% if not user.must_change_password %}<a class="button ghost" href="/">取消</a>{% endif %}
                <button class="button primary" type="submit"><i data-lucide="save"></i>保存新密码</button>
            </div>
        </form>
    </section>
</div>
{% endblock %}
