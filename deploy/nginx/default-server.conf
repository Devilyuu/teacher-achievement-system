server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    client_max_body_size 60m;

    location = /design {
        return 301 /design/;
    }

    location /design/api/ {
        proxy_pass http://127.0.0.1:8002/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300;
        proxy_send_timeout 300;
    }

    location /design/assets/ {
        alias /var/www/teaching-design-system/design/assets/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /design/ {
        alias /var/www/teaching-design-system/design/;
        try_files $uri $uri/ /design/index.html;
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location / {
        return 301 https://chengguo.youpulab.com$request_uri;
    }
}
